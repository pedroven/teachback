[project]
name = "teachback"
version = "0.0.3"
description = "Learn while you work with coding agents: a pairing mode that makes you explain before the agent codes, and spaced reviews of concepts you haven't fixed yet."
readme = "README.md"
authors = [
    { name = "Pedro" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fsrs>=6,<7",
    "mcp>=2,<3",
]

[project.urls]
Repository = "https://github.com/pedroven/teachback"

[project.scripts]
teachback = "teachback:main"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.15.20",
]
