[project]
name = "teachback"
version = "0.1.2"
description = "Learn while you work with coding agents: a pairing mode that makes you explain before the agent codes, and spaced reviews of concepts you haven't fixed yet."
readme = "README.md"
authors = [
    { name = "Pedro Costa" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8,<9",
    "fsrs>=6,<7",
    "mcp>=2,<3",
    "tomli>=2; python_version < '3.11'",  # tomllib's backport, to read Codex's config.toml
]

[project.urls]
Repository = "https://github.com/pedroven/teachback"

[project.scripts]
teachback = "teachback:main"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"plugin/skills/teachback" = "teachback/skills/teachback"  # plugin/skills/ stays the one source

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.15.20",
]
